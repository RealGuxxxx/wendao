name: Build iOS App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14 # Uses macOS Sequoia/Sonoma runner with Xcode pre-installed

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          node-version: '20.x'
          cache: 'npm'

      # 3. Install Dependencies
      - name: Install npm dependencies
        run: |
          npm install

      # 4. Sync Web Assets with Capacitor
      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      # 5. Check if Signing Secrets are Configured
      - name: Check Signing Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Signing secrets are configured. Proceeding with signed Release build."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "Signing secrets are missing. Proceeding with unsigned Simulator build."
          fi

      # 6. Install Certificate and Provisioning Profile (Only if secrets exist)
      - name: Install Apple Certificate and Provisioning Profile
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode base64 strings to files
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Register Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -aA1 UUID $PP_PATH | grep -o '[-A-Z0-9]\{36\}')
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      # 7a. Build Signed IPA (Release Mode - Only if secrets exist)
      - name: Build Signed Release Archive
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          # Build xcarchive
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive

      - name: Export IPA
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          # Create ExportOptionsPlist
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output

      # 7b. Build Unsigned Simulator App (Testing Mode - Only if secrets are missing)
      - name: Build Unsigned Simulator App
        if: steps.check_secrets.outputs.has_secrets == 'false'
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          # Create a build output directory and copy the .app package there
          mkdir -p $RUNNER_TEMP/build_output
          cp -R build/Debug-iphonesimulator/App.app $RUNNER_TEMP/build_output/ 2>/dev/null || cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/App.app $RUNNER_TEMP/build_output/

      # 8. Compress and Upload Build Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: ${{ runner.temp }}/build_output/
          if-no-files-found: error
